name: M5Stack and shared SDK
on:
  pull_request:
    paths: ['components/**', 'examples/common/**', 'examples/m5stack/**', 'tools/prepare_*.py', 'tests/**', 'CMakeLists.txt', '.github/workflows/m5stack.yml']
  push:
    branches: [main]
    paths: ['components/**', 'examples/common/**', 'examples/m5stack/**', 'tools/prepare_*.py', 'tests/**', 'CMakeLists.txt', '.github/workflows/m5stack.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare with synthetic credentials and build the standalone board
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install --disable-pip-version-check 'idf-component-manager==2.5.2'
          cp examples/m5stack/dependencies.lock /tmp/live-m5-expected.lock
          umask 077
          mkdir -p /tmp/live-m5-input
          printf '%s\n' 'ci-fixture-key-not-a-credential' > /tmp/live-m5-input/api-key
          printf '%s\n' '{"ssid":"ci-fixture-network","password":"testpass"}' > /tmp/live-m5-input/wifi.json
          python tools/prepare_m5stack.py --cache /tmp/live-m5 \
            --key-file /tmp/live-m5-input/api-key --wifi-file /tmp/live-m5-input/wifi.json
          export LIVE_VOICE_PRIVATE_DIR=/tmp/live-m5/private
          export LIVE_PEER_DEPS_DIR=/tmp/live-m5/vendor/peer
          idf.py -C examples/m5stack build
          python - <<'PY'
          from pathlib import Path
          import yaml
          def canonical(value):
              if isinstance(value, dict):
                  return {k: v.rstrip('/') if k == 'registry_url' else canonical(v)
                          for k, v in value.items()}
              if isinstance(value, list):
                  return [canonical(v) for v in value]
              return value
          expected = canonical(yaml.safe_load(Path('/tmp/live-m5-expected.lock').read_text()))
          actual = canonical(yaml.safe_load(Path('examples/m5stack/dependencies.lock').read_text()))
          assert actual == expected, 'Component versions, hashes, sources, or dependency graph drifted'
          PY
      - name: Shared protocol, UI, timing, and board PCM regression tests
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
          python -m unittest discover -s tests -p 'test_*.py'
