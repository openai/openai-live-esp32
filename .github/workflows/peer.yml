name: Portable peer
on:
  pull_request:
    paths: ['packages/peer/**', '.github/workflows/peer.yml']
  push:
    branches: [main]
    paths: ['packages/peer/**', '.github/workflows/peer.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.23'
          python-version: '3.13'
      - name: Build all transport dependencies with ASan and UBSan
        run: |
          cmake -S packages/peer -B build-peer -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DLIVE_PEER_FUZZ=ON
          cmake --build build-peer -j 4
          ctest --test-dir build-peer --output-on-failure
      - name: Standalone embedding without sanitizers
        run: |
          cmake -S packages/peer/tests/consumer -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer -j 4
          ./build-consumer/consumer
      - name: Interoperability and negative tests
        run: |
          uv sync --locked --project packages/peer/tests/interop
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --attacks --rounds 3 --corpus build-peer/dtls-corpus
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --server --attacks --rounds 3 --corpus build-peer/dtls-corpus
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --sdp-variants
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --sdp-variants --server
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --reject
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --server --reject
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --media audio
          uv run --locked --project packages/peer/tests/interop packages/peer/tests/interop/run.py ./build-peer/peer_interop --media data
      - name: Bounded parser, DTLS, and SCTP fuzz smoke tests
        run: |
          python3 packages/peer/tests/interop/seed_fuzz.py build-peer/corpus
          ./build-peer/peer_fuzz build-peer/corpus -max_total_time=30 -max_len=8193 -timeout=3 -rss_limit_mb=1024
          ./build-peer/peer_fuzz_dtls build-peer/dtls-corpus -max_total_time=30 -max_len=16384 -timeout=3 -rss_limit_mb=1024
          mkdir -p build-peer/corpus-sctp
          ./build-peer/peer_fuzz_sctp build-peer/corpus-sctp -max_total_time=30 -max_len=8192 -timeout=3 -rss_limit_mb=1024
